[package]
name = "agenda-gpui"
version = "0.3.7"
edition = "2021"
description = "GPUI clone of the Agenda task UI (experimental, KOS-124)"
publish = false
default-run = "agenda-gpui"
[workspace]
members = ["crates/agenda-core"]

[dependencies]
# gpui-kit 0.8 routes windows and rendering through gpui-fast.
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["gpui-fast"] }
gpui-component = { version = "=0.8.0", features = ["gpui-fast"] }
# NSH screens run in the same GPUI Fast renderer as the host app.
imago-nsh = { git = "https://github.com/makekosmos/imago.git", rev = "0dc83f181d0f091f7da074583079582278c407fd" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }

# a11y-tree + UI autotests: #[gpui::test] + TestAppContext/VisualTestContext
# live behind gpui's test-support feature (deterministic executors, test
# platform, debug_bounds). It merges only into test builds. (KOS-142 / main #6)
[features]
# Scripted end-to-end runs with real rendering and screenshots
# (`src/e2e/`, `scripts/e2e-macos.sh`). Never part of release builds.
e2e = ["gpui/test-support"]

[lints.rust]
# objc 0.2's `msg_send!` (src/native_menu.rs) expands
# `cfg(feature = "cargo-clippy")` inside this crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }


[target.'cfg(target_os = "macos")'.dependencies]
# Menu Close must call NSWindow performClose:, not GPUI remove_window.
objc = "0.2.7"
objc_exception = "0.1.2"

# Dev builds: own code compiles fast (opt-level 1, line-table debuginfo);
# dependencies stay fully optimized without debuginfo — unoptimized
# taffy/cosmic-text/gpui makes even modest UIs run at ~20fps (KOS-328).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

# GPUI fast gates debug selectors and test instrumentation on assertions.
[profile.dev.package.gpui-fast]
debug-assertions = true

[profile.dev.package.gpui-fast-macros]
debug-assertions = true

[profile.release]
# debug-assertions MUST stay false: gpui-pre-windows compiles its HLSL
# shaders via fxc only when build scripts are built without debug
# assertions (see its build.rs); the debug path is a runtime compile that
# bakes a Linux cargo-registry path into the exe when cross-compiling.
debug = false
debug-assertions = false

# Ensure gpui's build.rs (not just the lib) sees debug_assertions=false so it
# runs fxc and emits shaders_bytes.rs. Cargo's default release build-override
# can leave assertions on for build scripts.
[profile.release.build-override]
debug-assertions = false
opt-level = 0

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
gpui-fast-backend = { package = "gpui-fast", version = "=0.1.10", features = ["windows-manifest-provided-by-host"] }


[patch.crates-io]
# gpui-fast and its gpui-pre compatibility dependency are patched from the
# same Imago revision as the shared Agenda components. Agenda uses gpui-kit's
# gpui-fast feature and doesn't import gpui-pre itself.
gpui-fast = { git = "https://github.com/makekosmos/imago.git", rev = "9b73a3f1e471291faf8e50ea484f99c6f55e9789" }
gpui-pre = { git = "https://github.com/makekosmos/imago.git", rev = "9b73a3f1e471291faf8e50ea484f99c6f55e9789" }
