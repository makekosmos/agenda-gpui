[package]
name = "agenda-gpui"
version = "0.1.0"
edition = "2021"
description = "GPUI clone of the Agenda task UI (experimental, KOS-124)"
default-run = "agenda-gpui"

[dependencies]
# gpui-kit pins the matching gpui-pre snapshot (0.3.5) and puts GPUI at its
# root, so `use gpui::...` keeps working through this alias.
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Shared Kosmos GPUI visual core (theme/palettes seeded from this crate's
# src/theme.rs + src/palettes.rs — hex values byte-identical). Its
# gpui-base = "=0.6.4" pin constrains the transitive resolution for
# gpui-component 0.6.2 (0.6.5+ broke the inspector API).
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "300fe3717cb68f1f653c39310fffb0d0b8b8ba6e" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.1", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
# debug-assertions MUST stay false: gpui-pre-windows compiles its HLSL
# shaders via fxc only when build scripts are built without debug
# assertions (see its build.rs); the debug path is a runtime compile that
# bakes a Linux cargo-registry path into the exe when cross-compiling.
debug = false
debug-assertions = false

# Ensure gpui's build.rs (not just the lib) sees debug_assertions=false so it
# runs fxc and emits shaders_bytes.rs. Cargo's default release build-override
# can leave assertions on for build scripts.
[profile.release.build-override]
debug-assertions = false
opt-level = 0

# Unconditional: the build script itself compiles for the host, so a Linux →
# MSVC cross build (cargo-xwin) still needs embed-resource on non-Windows hosts.
[build-dependencies]
embed-resource = "3.0"

[patch.crates-io]
# Local patches carried over from vendor/gpui-0.2.2-patched: WM_NCHITTEST
# resolves window-control hitboxes at the cursor position carried by the
# message instead of the one-event-stale Window::mouse_hit_test. See
# vendor/gpui-pre-windows-0.3.5-patched/PATCH.md.
gpui-pre = { path = "vendor/gpui-pre-0.3.5-patched" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.5-patched" }

