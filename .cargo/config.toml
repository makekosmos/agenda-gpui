[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = [
  "-C", "link-arg=-static-libgcc",
  "-C", "link-arg=-static-libstdc++",
  # Prefer static winpthread; fall back to dynamic if the archive is missing.
  "-C", "link-arg=-Wl,-Bstatic",
  "-C", "link-arg=-lpthread",
  "-C", "link-arg=-Wl,-Bdynamic",
]

# KOS-328: link dev builds with lld (measured ~40% faster incremental links,
# docs/experiments/2026-09-30-build-speed.md in cortex). Requires `ld.lld`
# on PATH — e.g. the `lld` package, or a symlink to rust-lld from the
# toolchain's llvm-tools component.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
