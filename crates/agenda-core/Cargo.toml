[package]
name = "agenda-core"
version = "0.1.0"
edition = "2021"
description = "Pure task/calendar logic shared by desktop agenda-gpui and the Android app (KOS-370)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
