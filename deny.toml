[advisories]
version = 2
# Transitive, unmaintained-only advisories pinned by gpui-kit 0.6.2 /
# gpui-pre 0.3.5. No safe upgrade exists in the current upstream line;
# re-evaluate when gpui-kit is bumped.
ignore = [
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
    # Present on origin/main too: gpui-kit's pinned Linux/AT-SPI dependency graph
    # brings zbus 5.x; these crates were merged into zbus 6 and have no safe
    # standalone upgrade. Recheck by 2027-04-23 or when the pinned GPUI/Imago stack moves to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
    # nsh-js enables crypto in quickjs-jit-stdlib; Agenda embeds only its trusted TSX bundle and never performs RSA operations.
    "RUSTSEC-2023-0071", # rsa / Marvin timing attack
    # nsh-base enables syntax highlighting; Agenda does not render code blocks or parse untrusted source with syntect.
    "RUSTSEC-2025-0141", # bincode used by syntect
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# imago-gpui is consumed straight from the (public) imago repo by rev.
allow-git = ["https://github.com/makekosmos/imago.git"]
